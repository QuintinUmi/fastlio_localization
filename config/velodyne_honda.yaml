common:
    lid_topic:  "/velodyne_points"
    imu_topic:  "/imu/data"
    time_sync_en: false
    time_offset_lidar_to_imu: -0.013543

preprocess:
    lidar_type: 2                # Velodyne
    scan_line: 32
    scan_rate: 10                # Hz
    timestamp_unit: 0            # honda /velodyne_points 'time' field is in SECONDS (span ~0.1s) -> unit 0
    blind: 2

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    180
    det_range:     100.0
    extrinsic_est_en:  false
    extrinsic_T: [ -0.001595, -0.022252, 0.157731]
    extrinsic_R: [ 0.999394, -0.034800,  0.000902,
                  0.034802,  0.999391, -0.002629,
                  -0.000810,  0.002659,  0.999996]

publish:
    path_en:  false
    scan_publish_en:  true
    dense_publish_en: true
    scan_bodyframe_pub_en: true

pcd_save:
    pcd_save_en: false
    interval: -1

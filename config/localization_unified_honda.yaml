localization:
  map:
    map_file_path: "/media/quintinumi/dataset/bag/2026-6-5/reloc_out/maps/unified_shatin_ext_05.pcd"  # unified shatin+hkstp @0.5m, shatin ENU frame
    voxel_leaf: 0.0          # map already @0.5m -> skip global VoxelGrid (avoids int32 overflow on 2.7x5km extent)
    remove_outliers: false
    outlier_nb_neighbors: 20
    outlier_stddev_mul: 2.0

  ndt:
    resolutions: [3.0, 2.0, 1.0]
    max_iterations: [40, 50, 60]
    step_size: 0.7
    trans_eps: 1.0e-3
    use_imu_roll_pitch_init: true
    score_clip: 5.0

  gicp:
    enable: false
    max_iterations: 60
    max_corr_dist: 2.0
    trans_eps: 1.0e-4
    euclidean_fitness_epsilon: 1.0e-5
    correspondence_randomness: 30
    use_reciprocal: true

  keyframe:
    dist_thresh: 0.8
    yaw_thresh_deg: 8.0
    max_count: 60
    downsample_leaf: 0.8

  submap:
    build_radius: 80.0
    voxel_leaf: 1.0
    min_points: 2000

  scheduling:
    use_every_frame: false
    frame_stride: 2
    rebuild_submap_every_n_kf: 1
    resample_global_points_sec: 1.0

  global_align:
    roi_radius: 80.0
    use_cov_trigger: true
    drift_trans_thresh: 3.0
    drift_yaw_thresh_deg: 12.0
    use_fpfh_init: false
    fitness_thresh: 2.0
    fallback_expand_roi: 2.0
    max_roi_radius: 150.0

  global_point_residual:
    enable: true
    max_points: 1000   # honda: more global constraint
    voxel_leaf: 0.5
    plane_min_neighbors: 8
    max_point2plane_dist: 1.8   # honda: raise bad_thresh=0.6*1.8=1.08 (less aggressive local-tree clear) + more z-constraining ground matches
    normal_angle_thresh_deg: 45.0
    sigma_m: 0.06
    robust_kernel: "huber"
    huber_delta: 1.0   # honda: more robust
    cauchy_c: 0.5
    weight_from_fitness:
      enable: true
      k: 1.0
      eps: 0.05
      s_min: 0.7
      s_max: 2.5
    orientation_binning:
      enable: true
      bins: 8
      max_per_bin: 120

  local_point_residual:
    plane_min_neighbors: 6
    max_point2plane_dist: 0.4
    sigma_m: 0.07
    robust_kernel: "none"

  threading:
    global_align_async: true
    max_alignment_time_ms: 150

  performance:
    downsample_current_frame_leaf: 0.8

  debug:
    log_level: "INFO"
    publish_global_map: true
    publish_submap: true
    publish_trajectory: true
    viz_global_map_ds_ratio: 0.2
